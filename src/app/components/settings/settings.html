<div class="page-layout">
  <app-sidebar></app-sidebar>

  <main class="main-content">
    <div class="topbar">
      <h1>⚙️ Settings</h1>
      <p>Manage your app preferences</p>
    </div>

    <div class="settings-card">
      <div class="setting-row">
        <div>
          <h4>Dark Mode</h4>
          <p>Switch between light and dark theme</p>
        </div>
        <label class="toggle">
          <input type="checkbox" [(ngModel)]="darkMode" name="darkMode" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row">
        <div>
          <h4>Notifications</h4>
          <p>Receive updates about your items</p>
        </div>
        <label class="toggle">
          <input type="checkbox" [(ngModel)]="notifications" name="notifications" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </main>
</div>
