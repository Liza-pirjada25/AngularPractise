<div class="auth-wrapper">
  <div class="bg-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue to your dashboard</p>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            #usernameField="ngModel"
            required
            placeholder="Enter your username"
            [class.invalid]="usernameField.invalid && usernameField.touched"
          />
        </div>
        <span class="field-error" *ngIf="usernameField.invalid && usernameField.touched">
          Username is required
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            #passwordField="ngModel"
            required
            placeholder="Enter your password"
            [class.invalid]="passwordField.invalid && passwordField.touched"
          />
        </div>
        <span class="field-error" *ngIf="passwordField.invalid && passwordField.touched">
          Password is required
        </span>
      </div>

      <p class="error-banner" *ngIf="errorMsg">⚠️ {{ errorMsg }}</p>

      <button type="submit" [disabled]="loginForm.invalid">
        <span>Login</span>
      </button>
    </form>

    <p class="footer-note">Demo app — any username & password works</p>
  </div>
</div>
